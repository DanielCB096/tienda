name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar paquetes
        run: dotnet restore SistemaTienda/SistemaTienda.sln

      - name: Compilar
        run: dotnet build SistemaTienda/SistemaTienda.sln --no-restore --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test SistemaTienda/SistemaTienda.sln --no-build --configuration Release --logger "trx;LogFileName=pruebas.trx" --results-directory TestResults

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults/*.trx
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar paquetes
        run: dotnet restore SistemaTienda/SistemaTienda.sln

      - name: Compilar
        run: dotnet build SistemaTienda/SistemaTienda.sln --no-restore --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test SistemaTienda/SistemaTienda.sln --no-build --configuration Release --logger "trx;LogFileName=pruebas.trx" --results-directory TestResults

      - name: Reportar pruebas fallidas
        if: failure()
        shell: pwsh
        run: |
          $archivos = Get-ChildItem -Path TestResults -Filter *.trx -ErrorAction SilentlyContinue
          foreach ($archivo in $archivos) {
            [xml]$trx = Get-Content $archivo.FullName
            $ns = New-Object System.Xml.XmlNamespaceManager($trx.NameTable)
            $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
            foreach ($resultado in $trx.SelectNodes('//t:UnitTestResult[@outcome="Failed"]', $ns)) {
              $mensaje = [string]$resultado.Output.ErrorInfo.Message
              $traza = [string]$resultado.Output.ErrorInfo.StackTrace
              $primerFrame = ($traza -split "`r?`n" | Where-Object { $_ -match '\.cs:line' } | Select-Object -First 1)
              $detalle = "$mensaje $primerFrame".Trim()
              $detalle = $detalle.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
              Write-Host "::error title=$($resultado.testName)::$detalle"
            }
          }

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults/*.trx
          if-no-files-found: ignore
